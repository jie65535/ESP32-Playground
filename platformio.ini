; ESP32 Playground: first milestone is display and board diagnostics.

[platformio]
default_envs = playground
src_dir = main

[env:playground]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = es3n28p_r8n16
framework = espidf
monitor_speed = 115200
monitor_filters = direct
extra_scripts =
  pre:tools/platformio_font_sync.py
  post:tools/platformio_incremental_guard.py

; ESP-IDF emits DWARF/GDB data even for release builds.  It never reaches the
; device, but it grows the local ELF and makes every Windows link expensive.
; Remove it for the normal firmware profile; temporarily comment these flags
; when source-level GDB line information is required.
build_unflags =
  -ggdb
  -gdwarf-4

board_build.flash_size = 16MB
board_build.partitions = partitions_16MB.csv

build_flags =
  -I include
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D LV_CONF_INCLUDE_SIMPLE=1
