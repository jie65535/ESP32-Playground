; ESP32 Playground: first milestone is display and board diagnostics.

[platformio]
default_envs = playground

[env:playground]
platform = espressif32 @ 7.0.1
board = es3n28p_r8n16
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
  -I include
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

  ; TFT_eSPI configuration validated for ES3N28P / ILI9341V.
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MOSI=11
  -D TFT_SCLK=12
  -D TFT_MISO=13
  -D TFT_CS=10
  -D TFT_DC=46
  -D TFT_RST=-1
  -D TFT_BL=45
  -D TFT_BACKLIGHT_ON=HIGH
  -D TOUCH_CS=-1
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_INVERSION_ON=1
  -D USE_HSPI_PORT=1
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000
  -D LV_CONF_INCLUDE_SIMPLE=1

lib_deps =
  bodmer/TFT_eSPI @ 2.5.43
  lvgl/lvgl @ 9.5.0
